<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00f5ff" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <rect x="80" y="120" width="1040" height="560" rx="18" ry="18" fill="rgba(0,0,0,0.45)" stroke="#00f5ff" stroke-opacity="0.5"/>
  <rect x="110" y="150" width="980" height="4" fill="url(#glow)"/>

  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#00f5ff" fill-opacity="0.7" letter-spacing="6">PROJECT IMAGE</text>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e0f7ff" fill-opacity="0.6" letter-spacing="3">PLACEHOLDER</text>
</svg>
